services:
  treinamento:
    working_dir: /app/outputs
    build:
      context: .
      dockerfile: Dockerfile
    image: tech-challenge-fiap:local
    init: true

    environment:
      PYTHONPATH: /app/src

    volumes:
      - ./notebooks:/app/notebooks
      - ./outputs:/app/outputs
      - type: bind
        source: ./data
        target: /app/data
        read_only: true

    shm_size: "2gb"